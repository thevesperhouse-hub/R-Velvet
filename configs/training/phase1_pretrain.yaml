# Phase 1: Base LM pretraining (no ACR, no iterative reasoning)
phase: phase1_pretrain
use_acr: false
use_iterative_reasoning: false
optimizer: velvet           # adamw or velvet

lr: 3e-4
min_lr: 3e-5
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
grad_clip: 1.0

batch_size: 32
grad_accum_steps: 2
max_steps: 200000
warmup_steps: 3000
lr_schedule: cosine

amp: bf16               # bf16 if supported, else fp16
compile: true            # torch.compile (Hopper/Ampere+)

# Checkpointing
save_every: 1000
keep_last_n: 5
resume_from: null

# Logging
log_every: 50
wandb: false
wandb_project: r-velvet
wandb_run: phase1

# Debug
debug: false             # if true: debug_steps steps, no save, no wandb
debug_steps: 500
debug_log_every: 10
